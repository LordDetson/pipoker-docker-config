# Activity and capacity dashboards for both environments: Prometheus collects the metrics of the backends and of the
# server itself, Grafana shows them, and Alertmanager sends the capacity alerts (see rules/) to Telegram and by email.
# Grafana opens at https://<QA_DOMAIN>/grafana/ behind the QA login (see ../caddy/config/Caddyfile). Nothing here has a port
# of its own on the server.
name: pipoker-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # A few dozen series take a few megabytes a year, so two years of history cost nothing
      - --storage.tsdb.retention.time=2y
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    mem_limit: 256m
    networks:
      - edge

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    entrypoint: /etc/alertmanager/start
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?}
      ALERT_EMAIL: ${ALERT_EMAIL:?}
      SMTP_SMARTHOST: ${SMTP_SMARTHOST:?}
      SMTP_USERNAME: ${SMTP_USERNAME:?}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      GRAFANA_ROOT_URL: ${GRAFANA_ROOT_URL:?}
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      # Which alerts were sent and which are silenced, kept across restarts so nothing is sent twice
      - alertmanager-data:/alertmanager
    mem_limit: 64m
    networks:
      - edge

  # The load of the server as a whole. It looks at the server's /proc and /sys, mounted read-only.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m
    networks:
      - edge

  # The load of every container: processor, memory against its limit, network. Docker's own data is read-only;
  # cAdvisor needs the privileged mode to read the statistics of the other containers.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --enable_metrics=cpu,memory,network
      - --store_container_labels=false
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    mem_limit: 192m
    networks:
      - edge

  grafana:
    image: grafana/grafana-oss:11.3.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:?}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Caddy already asks for the QA login from outside, so whoever gets here may look at the dashboard,
      # and nobody can sign in to change it: it comes from the files in ./grafana
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/activity.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m
    networks:
      edge:
        aliases:
          - pipoker-grafana

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  # Shared with Caddy and the backends of both environments
  edge:
    name: pipoker-edge
    external: true

# One PiPoker environment (QA or PROD): database, broker, backend and web client.
# Started by ./update with an environment file: qa.env or prod.env.
name: pipoker-${PIPOKER_ENV:?}

services:
  mongodb:
    build: ../mongodb-image
    image: pipoker/mongodb
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?}
      MONGO_INITDB_DATABASE: pipoker
      MONGODB_APP_USERNAME: ${MONGODB_APP_USERNAME:?}
      MONGODB_APP_PASSWORD: ${MONGODB_APP_PASSWORD:?}

  rabbitmq:
    build: ../rebbitmq-image
    image: pipoker/rebbitmq-with-stomp
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${BROKER_USERNAME:?}
      RABBITMQ_DEFAULT_PASS: ${BROKER_PASSWORD:?}

  backend:
    image: ghcr.io/lorddetson/pipoker-controller:${BACKEND_TAG:-main}
    restart: unless-stopped
    depends_on:
      - mongodb
      - rabbitmq
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      APP_PORT: 8080
      BROKER_HOST: rabbitmq
      STOMP_BROKER_PORT: 61613
      STOMP_BROKER_SYSTEM_LOGIN: ${BROKER_USERNAME}
      STOMP_BROKER_SYSTEM_PASS: ${BROKER_PASSWORD}
      STOMP_BROKER_USER_LOGIN: ${BROKER_USERNAME}
      STOMP_BROKER_USER_PASS: ${BROKER_PASSWORD}
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DBNAME: pipoker
      MONGODB_USR: ${MONGODB_APP_USERNAME}
      MONGODB_PASS: ${MONGODB_APP_PASSWORD}
    mem_limit: 768m
    networks:
      default:
      edge:
        aliases:
          - ${PIPOKER_ENV}-backend

  web:
    image: ghcr.io/lorddetson/pipoker-web:${WEB_TAG:-main}
    restart: unless-stopped
    networks:
      edge:
        aliases:
          - ${PIPOKER_ENV}-web

volumes:
  mongodb-data:

networks:
  # Shared with Caddy, which serves both environments on their own domains
  edge:
    name: pipoker-edge
    external: true

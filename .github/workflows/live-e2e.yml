name: Live E2E

# Uses PiPoker the way people do: several browsers in one room, phones and many teams at once.
# The qa job tests the running QA from the internet, with the login QA asks for outside the home network
# (repository secrets QA_USERNAME and QA_PASSWORD); every test removes the rooms it created. PROD is left to its users.
# The local job builds pipoker-app and pipoker-web from the chosen branches, starts them like the server does
# and runs the same tests there, so a fix can be checked before it is merged.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Environment for the qa job
        default: https://pipoker-qa.duckdns.org
      app_ref:
        description: pipoker-app branch for the local job
        default: main
      web_ref:
        description: pipoker-web branch for the local job
        default: main

concurrency:
  group: live-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ inputs.url || 'https://pipoker-qa.duckdns.org' }}
      QA_USERNAME: ${{ secrets.QA_USERNAME }}
      QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
    steps:
      - name: Log in to QA
        run: |
          if [ -z "$QA_USERNAME" ] || [ -z "$QA_PASSWORD" ]; then
            echo "::error::Add the repository secrets QA_USERNAME and QA_PASSWORD (Settings, Secrets and variables, Actions) with the login QA asks for"
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -u "$QA_USERNAME:$QA_PASSWORD" "$BASE_URL/ws/info") || status=none
          if [ "$status" != 200 ]; then
            echo "::error::QA answered $status to the login from QA_USERNAME and QA_PASSWORD at $BASE_URL/ws/info"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: ./.github/actions/e2e

  local:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_URL: http://prod.localhost
      APP_REF: ${{ inputs.app_ref }}
      WEB_REF: ${{ inputs.web_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: LordDetson/pipoker-app
          ref: ${{ env.APP_REF }}
          path: build/pipoker-app

      - uses: actions/checkout@v4
        with:
          repository: LordDetson/pipoker-web
          ref: ${{ env.WEB_REF }}
          path: build/pipoker-web

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: build/pipoker-app/**/pom.xml

      - name: Build pipoker-app ${{ env.APP_REF }} and pipoker-web ${{ env.WEB_REF }}
        run: |
          cd build/pipoker-app
          ./mvnw -B -q package -DskipTests
          find pipoker-controller/target -maxdepth 1 -name 'pipoker-controller-*.jar' ! -name '*-sources.jar' -exec cp {} pipoker-controller/target/app.jar \;
          docker build -q -t ghcr.io/lorddetson/pipoker-controller:local pipoker-controller
          cd ../pipoker-web
          docker build -q -t ghcr.io/lorddetson/pipoker-web:local .

      - name: Start PROD locally
        working-directory: server
        run: |
          sed 's/_TAG=.*/_TAG=local/' prod.env.example > prod.env
          printf 'PROD_DOMAIN=http://prod.localhost\nQA_DOMAIN=http://qa.localhost\nQA_USERNAME=test\n' > caddy/.env
          echo "QA_PASSWORD_HASH='$(docker run --rm caddy:2-alpine caddy hash-password --plaintext test)'" >> caddy/.env
          echo "127.0.0.1 prod.localhost" | sudo tee -a /etc/hosts
          docker network create pipoker-edge
          docker compose --env-file prod.env -f compose.yml up -d --quiet-pull
          docker compose -f caddy/compose.yml up -d --quiet-pull
          for attempt in $(seq 1 60); do
            curl -fsS "$BASE_URL/ws/info" > /dev/null && break
            sleep 2
          done
          # The backend connects to RabbitMQ in the background, so the first attempts may come too early
          for attempt in 1 2 3 4 5; do
            ./check "$BASE_URL" && exit 0
            sleep 5
          done
          exit 1

      - uses: ./.github/actions/e2e
        with:
          report: playwright-report-local
          # Rooms that are gone are reported as errors too; those are expected
          server-logs: docker compose --env-file server/prod.env -f server/compose.yml logs --no-log-prefix backend | grep -E 'WARN|ERROR|Exception' | grep -v 'is not found' | tail -60 || true

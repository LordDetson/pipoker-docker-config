# One PiPoker environment (QA or PROD): database, broker, backend and web client.
# Started by ./update with an environment file: qa.env or prod.env.
name: pipoker-${PIPOKER_ENV:?}

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
      - ./mongodb/create-app-user.js:/docker-entrypoint-initdb.d/create-app-user.js:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?}
      MONGO_INITDB_DATABASE: pipoker
      MONGODB_APP_USERNAME: ${MONGODB_APP_USERNAME:?}
      MONGODB_APP_PASSWORD: ${MONGODB_APP_PASSWORD:?}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    restart: unless-stopped
    volumes:
      - ./rabbitmq-plugins:/etc/rabbitmq/enabled_plugins:ro
    environment:
      RABBITMQ_DEFAULT_USER: ${BROKER_USERNAME:?}
      RABBITMQ_DEFAULT_PASS: ${BROKER_PASSWORD:?}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      retries: 30

  backend:
    image: ghcr.io/lorddetson/pipoker-controller:${BACKEND_TAG:-main}
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      APP_PORT: 8080
      BROKER_HOST: rabbitmq
      STOMP_BROKER_PORT: 61613
      STOMP_BROKER_SYSTEM_LOGIN: ${BROKER_USERNAME}
      STOMP_BROKER_SYSTEM_PASS: ${BROKER_PASSWORD}
      STOMP_BROKER_USER_LOGIN: ${BROKER_USERNAME}
      STOMP_BROKER_USER_PASS: ${BROKER_PASSWORD}
      # Page origins allowed to open a room WebSocket (see the environment file); unset means any origin
      STOMP_ALLOWED_ORIGINS: ${STOMP_ALLOWED_ORIGINS:-*}
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DBNAME: pipoker
      MONGODB_USR: ${MONGODB_APP_USERNAME}
      MONGODB_PASS: ${MONGODB_APP_PASSWORD}
      # Feedback from the site becomes issues of the Jira project once these are set, and is only logged until then
      PIPOKER_ENV: ${PIPOKER_ENV}
      JIRA_URL: ${JIRA_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT: ${JIRA_PROJECT:-PIP}
    mem_limit: 768m
    networks:
      default:
      edge:
        aliases:
          - ${PIPOKER_ENV}-backend

  web:
    image: ghcr.io/lorddetson/pipoker-web:${WEB_TAG:-main}
    restart: unless-stopped
    networks:
      edge:
        aliases:
          - ${PIPOKER_ENV}-web

volumes:
  mongodb-data:

networks:
  # Shared with Caddy, which serves both environments on their own domains
  edge:
    name: pipoker-edge
    external: true

name: Monitor PROD

# Checks PROD from outside the home network every 5 minutes, so a dead server, a power cut
# or a home internet outage is noticed too. When PROD breaks, the workflow opens an issue labelled
# "outage" (GitHub emails it) and sends a Telegram message; when PROD works again, it closes the issue.
# Telegram needs the repository secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.

on:
  schedule:
    - cron: '*/5 * * * *'
  # Runs the check (without alerts) on changes to it, against the real PROD
  pull_request:
    paths:
      - .github/workflows/monitor.yml
      - server/check
      - server/smoke-test.mjs
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a test message to Telegram
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  issues: write

concurrency: monitor

env:
  PROD_URL: https://pipoker.duckdns.org
  GH_TOKEN: ${{ github.token }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  prod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Send a test message
        if: inputs.test_alert
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are not set"
            exit 1
          fi
          curl -fsS --max-time 20 "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=✅ Тестовое сообщение мониторинга PiPoker. Если PROD сломается, сообщение придёт сюда." > /dev/null

      - name: Check PROD
        id: check
        working-directory: server
        run: |
          # A single failure can be a network hiccup, so PROD counts as broken only after three in a row
          for attempt in 1 2 3; do
            if problem=$(./check "$PROD_URL"); then
              echo "PROD works"
              exit 0
            fi
            echo "Attempt $attempt: $problem"
            [ "$attempt" = 3 ] || sleep 30
          done
          {
            echo 'problem<<EOF'
            echo "$problem"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          [ "$GITHUB_EVENT_NAME" != pull_request ] || exit 1

      - name: Report
        if: github.event_name != 'pull_request'
        env:
          PROBLEM: ${{ steps.check.outputs.problem }}
        run: |
          telegram() {
            if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
              echo "::warning::Telegram is not set up, the alert is only in the issue"
              return
            fi
            curl -fsS --max-time 20 "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode "disable_web_page_preview=true" \
              --data-urlencode "text=$1" > /dev/null || echo "::warning::Telegram message was not sent"
          }

          gh label create outage --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "PROD is down, opened and closed by the Monitor PROD workflow" 2> /dev/null || true
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label outage --state open --json number --jq '.[0].number // empty')

          if [ -n "$PROBLEM" ] && [ -z "$issue" ]; then
            address=$(dig +short "${PROD_URL#https://}" | tail -n 1)
            # Assigning the owner makes GitHub notify them by email even without watching the repository
            gh issue create --repo "$GITHUB_REPOSITORY" --label outage --assignee "$GITHUB_REPOSITORY_OWNER" \
              --title "PROD не работает" \
              --body "$(printf '%s\n\nАдрес %s сейчас указывает на %s.\nПроверка: %s\n\nЗадача закроется сама, когда PROD снова заработает.' \
                "$PROBLEM" "$PROD_URL" "${address:-никуда (DNS не отвечает)}" "$RUN_URL")"
            telegram "🔴 PiPoker PROD не работает
          $PROBLEM

          $PROD_URL
          Проверка: $RUN_URL"
          elif [ -z "$PROBLEM" ] && [ -n "$issue" ]; then
            opened=$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json createdAt --jq .createdAt)
            minutes=$(( ($(date +%s) - $(date -d "$opened" +%s)) / 60 ))
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "PROD снова работает (не работал около $minutes мин). Проверка: $RUN_URL"
            telegram "🟢 PiPoker PROD снова работает (не работал около $minutes мин)
          $PROD_URL"
          elif [ -n "$PROBLEM" ]; then
            echo "Still broken, already reported in issue #$issue: $PROBLEM"
          fi

      - name: Keep the schedule enabled
        if: github.event_name != 'pull_request'
        # GitHub turns off scheduled workflows of a public repository after 60 days without commits
        continue-on-error: true
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/monitor.yml/enable"

      - name: Tell Healthchecks.io the monitor is alive
        # If GitHub stops or delays the runs, Healthchecks.io notices the missing pings and alerts on its own
        if: github.event_name != 'pull_request' && env.HEALTHCHECKS_PING_URL != ''
        continue-on-error: true
        run: curl -fsS --max-time 20 --retry 3 "$HEALTHCHECKS_PING_URL" > /dev/null
